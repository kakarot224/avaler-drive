<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Avaler Drive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a slim bar on top, the phone screen centred and scaled to fit below; screen list as a side panel (wide) or a sheet (phone). */
:root {
  --bg: #E4E8EE;
  --surface: #FFFFFF;
  --fg: #0E1726;
  --muted: #5B6577;
  --line: #D5DBE3;
  --accent: #FFC233;
  --on-accent: #0E1726;
  --font-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: Manrope, Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A0F18; --surface: #131B2A; --fg: #EEF2F7; --muted: #9AA6B8; --line: #26324A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0A0F18; --surface: #131B2A; --fg: #EEF2F7; --muted: #9AA6B8; --line: #26324A; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow-x: hidden; }
button, input { font-family: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }

.bar { flex: none; height: 52px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; }
.brand-txt { min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { height: 38px; padding-inline: 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:focus-visible, .nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { flex: 1; min-height: 0; display: flex; }
.panel { width: 260px; flex: none; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding-block: 16px; }
.nav h2 { margin: 16px 20px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.nav h2:first-child { margin-top: 0; }
.nav a { display: block; padding: 9px 20px; color: var(--fg); text-decoration: none; font-size: 14px; }
.nav a[aria-current="page"] { background: var(--bg); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.hint { margin: 18px 20px 0; font-size: 12px; line-height: 1.5; color: var(--muted); }

.stage { flex: 1; min-width: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
.frame { flex: none; position: relative; border-radius: 34px; overflow: hidden; box-shadow: 0 20px 60px rgba(14, 23, 38, 0.25), 0 0 0 8px #0E1726; }
.device { width: 390px; height: 844px; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
.device a { color: inherit; }
.stage.wide { display: block; padding: 0; }
.wide-wrap { min-height: 100%; }

.sheet-back { position: fixed; inset: 0; background: rgba(10, 15, 24, 0.5); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; z-index: 21; padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 8px; }
.sheet-head strong { font-family: var(--font-display); font-size: 17px; }

@media (max-width: 899px) {
  .panel { display: none; }
  .stage { padding: 10px; }
  .frame { border-radius: 26px; box-shadow: 0 10px 30px rgba(14, 23, 38, 0.2); }
}
@media (min-width: 900px) { #menuBtn { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">A</div>
      <div class="brand-txt">
        <div class="brand-name">Avaler Drive</div>
        <div class="brand-sub" id="screenName">Maquette cliquable</div>
      </div>
    </div>
    <button class="btn" id="menuBtn" type="button" aria-haspopup="dialog">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="7" height="8" rx="1.5"></rect><rect x="13" y="3" width="7" height="8" rx="1.5"></rect><rect x="4" y="13" width="7" height="8" rx="1.5"></rect><rect x="13" y="13" width="7" height="8" rx="1.5"></rect></svg>

    </aside>
    <div class="stage" id="stage"></div>
  </div>
</div>
<div class="sheet-back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Choisir un écran" hidden>
  <div class="sheet-head"><strong>Écrans</strong><button class="btn" id="sheetClose" type="button">Fermer</button></div>
  <nav class="nav" id="navSheet"></nav>
</div>

const START = 'ClientConnexion';
let current = null;
const instances = {};

class DCLogic {
  constructor() { this.state = {}; this.props = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, patch); render(); }
  forceUpdate() { render(); }
}

function getInstance(id) {
  if (!instances[id]) {
    const Cls = LOGIC[id](DCLogic);
    instances[id] = new Cls();
  }
  return instances[id];
}

function lookup(expr, scope) {
  const e = expr.trim();
  if (e === 'true') return true;
  if (e === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(e)) return Number(e);
  return e.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (_, ex) => { const v = lookup(ex, scope); return v == null ? '' : String(v); });
}

function expandLoop(el, listExpr, as, scope, wrapper) {
  const list = lookup(listExpr, scope) || [];
  const parent = el.parentNode;
  list.forEach((item, i) => {
    const s = Object.assign({}, scope, { [as]: item, $index: i });
    if (wrapper) {
      const frag = document.createDocumentFragment();
      Array.from(el.childNodes).forEach((c) => frag.appendChild(c.cloneNode(true)));
      processChildren(frag, s);
      parent.insertBefore(frag, el);
    } else {
      const copy = el.cloneNode(true);
      copy.removeAttribute('data-for'); copy.removeAttribute('data-as');
      parent.insertBefore(copy, el);
      processNode(copy, s);
    }
  });
  parent.removeChild(el);
}

function processChildren(node, scope) {
  Array.from(node.childNodes).forEach((c) => processNode(c, scope));
}

function processNode(node, scope) {
  if (node.nodeType === 3) {
    if (node.nodeValue.indexOf('{{') >= 0) node.nodeValue = interp(node.nodeValue, scope);
    return;
  }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-for') {
    const m = WHOLE.exec(node.getAttribute('list') || '');
    expandLoop(node, m ? m[1] : '', node.getAttribute('as'), scope, true);
    return;
  }
  if (node.hasAttribute('data-for')) {
    expandLoop(node, node.getAttribute('data-for'), node.getAttribute('data-as'), scope, false);
    return;
  }
  if (tag === 'sc-if') {
    const m = WHOLE.exec(node.getAttribute('value') || '');
    const ok = m ? lookup(m[1], scope) : false;
    if (ok) {
      processChildren(node, scope);
      while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
    }
    node.parentNode.removeChild(node);
    return;
  }
  Array.from(node.attributes).forEach((a) => {
    const name = a.name;
    if (name.indexOf('hint-') === 0) { node.removeAttribute(name); return; }
    if (name === 'onclick') {
      const m = WHOLE.exec(a.value);
      node.removeAttribute(name);
      const fn = m ? lookup(m[1], scope) : null;
      if (typeof fn === 'function') node.addEventListener('click', (ev) => { ev.preventDefault(); fn(); });
      return;
    }
    if (a.value.indexOf('{{') >= 0) node.setAttribute(name, interp(a.value, scope));
  });
  if (tag === 'a') {
    const href = node.getAttribute('href') || '';
    const m = /^([A-Za-z0-9]+)\.dc\.html$/.exec(href);
    if (m) node.setAttribute('href', '#' + m[1]);
    else if (href.charAt(0) === '#') {
      node.addEventListener('click', (ev) => {
        ev.preventDefault();
        const t = href.length > 1 ? document.getElementById(href.slice(1)) : null;
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }
  processChildren(node, scope);
}

function buildNav(target) {
  target.innerHTML = '';
  DATA.nav.forEach((g) => {
    const h = document.createElement('h2'); h.textContent = g.group; target.appendChild(h);
    g.items.forEach((it) => {
      const a = document.createElement('a');
      a.href = '#' + it.id; a.textContent = it.label; a.dataset.id = it.id;
      a.addEventListener('click', closeSheet);
      target.appendChild(a);
    });
  });
}

const stage = document.getElementById('stage');
function fit() {
  const frame = stage.querySelector('.frame');
  if (!frame) return;
  const cs = getComputedStyle(stage);
  const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  const s = Math.max(0.3, Math.min(aw / 390, ah / 844, 1.15));
  frame.style.width = Math.floor(390 * s) + 'px';
  frame.style.height = Math.floor(844 * s) + 'px';
  frame.querySelector('.device').style.transform = 'scale(' + s + ')';
}

function render() {
  const id = current;
  const sc = DATA.screens[id];
  const inst = getInstance(id);
  let vals = {};
  try { vals = inst.renderVals() || {}; } catch (e) { console.error(e); }
  const tpl = document.createElement('template');
  tpl.innerHTML = sc.tpl;
  const frag = tpl.content;
  processChildren(frag, vals);
  const keepScroll = stage.scrollTop;
  stage.innerHTML = '';
  if (sc.wide) {
    stage.className = 'stage wide';
    const w = document.createElement('div'); w.className = 'wide-wrap'; w.appendChild(frag);
    stage.appendChild(w);
  } else {
    stage.className = 'stage';
    const frame = document.createElement('div'); frame.className = 'frame';
    const dev = document.createElement('div'); dev.className = 'device'; dev.appendChild(frag);
    frame.appendChild(dev); stage.appendChild(frame);
    fit();
  }
  stage.scrollTop = keepScroll;
}

function show(id) {
  if (!DATA.screens[id]) id = START;
  const changed = id !== current;
  current = id;
  render();
  if (changed) stage.scrollTop = 0;
  const sc = DATA.screens[id];
  document.getElementById('screenName').textContent = sc.group + ' · ' + sc.label;
  document.querySelectorAll('.nav a').forEach((a) => {
    if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

const sheet = document.getElementById('sheet');
const sheetBack = document.getElementById('sheetBack');
function openSheet() { sheet.hidden = false; sheetBack.hidden = false; }
function closeSheet() { sheet.hidden = true; sheetBack.hidden = true; }
document.getElementById('menuBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
sheetBack.addEventListener('click', closeSheet);

buildNav(document.getElementById('navSide'));
buildNav(document.getElementById('navSheet'));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
window.addEventListener('resize', fit);
show(location.hash.slice(1) || START);
</script>
